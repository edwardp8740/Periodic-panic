<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Chem Game</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    #question-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(8, 8, 16, 0.92);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      font-family: 'Space Mono', monospace;
    }

    #question-screen.visible {
      display: flex;
    }

    .q-card {
      background: #0f0f1e;
      border: 2px solid #3a3a6e;
      border-radius: 4px;
      padding: 48px 52px;
      max-width: 620px;
      width: 90%;
      box-shadow: 0 0 60px rgba(100, 80, 255, 0.15), 0 0 0 1px #1a1a3a;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";

    // I set up the game window here.
    kaboom({
      global: true,
      width: 1280,
      height: 720
    });

    // I keep the main movement numbers here so they are easy to change.
    const SPEED = 320;
    const JUMP_FORCE = 950;
    const TILE = 64;

    // I use this to keep ground traps above the floor instead of inside it.
    const FLOOR_TOP = 512;
    const MINE_Y = FLOOR_TOP - 46;
    const LOW_TRAP_Y = 462;
    const MID_TRAP_Y = 280;
    const HIGH_TRAP_Y = 155;

    let deaths = 0;
    let hurtTimer = 0;

    // I pad every map row so Kaboom reads the level cleanly.
    function padMap(map) {
      let max = Math.max(...map.map(r => r.length));
      return map.map(r => r.padEnd(max, " "));
    }

    // I use this for quick solid-color backgrounds.
    function bg(c) {
      add([
        rect(width(), height()),
        pos(0, 0),
        color(...c),
        fixed()
      ]);
    }

    // I move the player back to the checkpoint unless they are out of health.
    function hurtPlayer(p, checkpoint) {
      if (hurtTimer > 0) return false;

      hurtTimer = 0.4;
      p.hurt(1);

      if (p.hp() <= 0) {
        deaths++;
        return true;
      }

      p.pos = checkpoint.clone();
      p.vel = vec2(0, 0);
      return false;
    }

    // I drop a falling trap near a certain x spot.
    function fallingAt(x, span = 420, speed = 360) {
      const f = add([
        rect(28, 28),
        pos(x + rand(-span, span), -50),
        area(),
        color(255, 90, 90),
        "danger"
      ]);

      f.onUpdate(() => {
        f.pos.y += speed * dt();

        if (f.pos.y > FLOOR_TOP + 80) {
          destroy(f);
        }
      });
    }

    // I make a whole section rain hazards instead of only the start area.
    function fallingZone(x, interval = 1, span = 420, speed = 360) {
      loop(interval, () => {
        fallingAt(x, span, speed);
      });
    }

    // I keep chasers above the floor so they do not sink into the level.
    function chaser(player, x, y = 200) {
      const e = add([
        rect(34, 34),
        pos(x, y),
        area(),
        color(255, 60, 60),
        "danger"
      ]);

      e.dir = 1;

      e.onUpdate(() => {
        let dx = player.pos.x - e.pos.x;
        let dy = player.pos.y - e.pos.y;

        e.pos.x += Math.sign(dx) * 170 * dt() + e.dir * 120 * dt();
        e.pos.y += Math.sign(dy) * 110 * dt();

        if (e.pos.y < 90) e.pos.y = 90;
        if (e.pos.y > 466) e.pos.y = 466;

        if (rand() < 0.03) e.dir *= -1;
      });
    }

    // I stop lasers before they reach the bottom floor.
    function laser(x, minY = 120, maxY = 330, speed = 240) {
      const l = add([
        rect(28, 160),
        pos(x, minY),
        area(),
        color(255, 230, 80),
        "danger"
      ]);

      l.dir = 1;

      l.onUpdate(() => {
        l.pos.y += l.dir * speed * dt();

        if (l.pos.y > maxY) {
          l.pos.y = maxY;
          l.dir = -1;
        }

        if (l.pos.y < minY) {
          l.pos.y = minY;
          l.dir = 1;
        }
      });
    }

    // I keep crushers moving in the open air instead of under the map.
    function crusher(x, minY = 90, maxY = 300, speed = 250) {
      const c = add([
        rect(80, 200),
        pos(x, minY),
        area(),
        color(255, 120, 120),
        "danger"
      ]);

      c.dir = 1;

      c.onUpdate(() => {
        c.pos.y += c.dir * speed * dt();

        if (c.pos.y > maxY) {
          c.pos.y = maxY;
          c.dir = -1;
        }

        if (c.pos.y < minY) {
          c.pos.y = minY;
          c.dir = 1;
        }
      });
    }

    // I keep the acid low enough to start visible but still dangerous.
    function acid() {
      const a = add([
        rect(6000, 90),
        pos(-500, 650),
        area(),
        color(60, 255, 120),
        "danger"
      ]);

      a.onUpdate(() => {
        a.pos.y -= 7 * dt();
      });
    }

    // I use sweepers as moving horizontal traps above the floor.
    function sweeper(x, y = LOW_TRAP_Y, range = 180, speed = 3) {
      const s = add([
        rect(150, 18),
        pos(x, y),
        area(),
        color(255, 160, 60),
        "danger"
      ]);

      const startX = s.pos.x;
      let t = 0;

      s.onUpdate(() => {
        t += dt();
        s.pos.x = startX + Math.sin(t * speed) * range;
      });
    }

    // I use darts as fast side-to-side traps in different lanes.
    function dart(x, y = MID_TRAP_Y, speed = 420, leftRange = 520, rightRange = 120) {
      const d = add([
        rect(56, 16),
        pos(x, y),
        area(),
        color(255, 255, 120),
        "danger"
      ]);

      const startX = d.pos.x;
      d.dir = -1;

      d.onUpdate(() => {
        d.pos.x += d.dir * speed * dt();

        if (d.pos.x < startX - leftRange) d.dir = 1;
        if (d.pos.x > startX + rightRange) d.dir = -1;
      });
    }

    // I place mines on top of the floor, not inside the floor.
    function mine(x, y = MINE_Y) {
      add([
        rect(46, 46),
        pos(x, y),
        area(),
        color(255, 70, 150),
        "danger"
      ]);
    }

    // I define the level blocks here.
    const tiles = {
      "=": () => [
        rect(TILE, TILE),
        area(),
        body({ isStatic: true }),
        color(100, 200, 255),
        "solid",
        "troll"
      ],

      "c": () => [
        rect(40, 40),
        area(),
        color(100, 255, 100),
        "checkpoint"
      ],

      "e": () => [
        rect(40, 40),
        area(),
        color(200, 100, 255),
        "end"
      ],
    };

    // I keep all levels here and spread each level's traps across the whole map.
    const levels = [
      {
        title: "Unit 1 Intro Troll",
        bg: [180, 220, 255],
        start: vec2(100, 100),
        map: [
          "====================================================================================",
          "=                                                                                  =",
          "= c                                                                                =",
          "=        ====      ====      ====      ====      ====      ====                    =",
          "=                                                                                  =",
          "=             ====      ====      ====      ====      ====      ====               =",
          "=                                                                                  =",
          "=                                                                              e   =",
          "====================================================================================",
        ],
        special(p) {
          fallingZone(700, 1.4);
          fallingZone(2600, 1.5);
          crusher(650);
          sweeper(1050, LOW_TRAP_Y);
          mine(1450);
          laser(1900);
          dart(2450, MID_TRAP_Y);
          sweeper(3100, HIGH_TRAP_Y, 160, 3.5);
          mine(3600);
          crusher(4150);
          dart(4700, LOW_TRAP_Y, 460);
        }
      },

      {
        title: "Unit 2 Falling Chaos",
        bg: [255, 210, 140],
        start: vec2(100, 100),
        map: [
          "====================================================================================",
          "=                                                                                  =",
          "= c                                                                                =",
          "=        ====      ====      ====      ====      ====      ====      ====          =",
          "=                                                                                  =",
          "=             ====      ====      ====      ====      ====      ====      ====     =",
          "=                                                                                  =",
          "=                                                                              e   =",
          "====================================================================================",
        ],
        special(p) {
          fallingZone(700, 0.75, 420, 380);
          fallingZone(1900, 0.8, 420, 390);
          fallingZone(3200, 0.85, 420, 400);
          fallingZone(4400, 0.9, 420, 410);
          laser(850);
          dart(1350, MID_TRAP_Y, 430);
          sweeper(2050, LOW_TRAP_Y, 190, 3.3);
          mine(2550);
          laser(3050, 100, 330, 260);
          dart(3700, HIGH_TRAP_Y, 500);
          sweeper(4300, MID_TRAP_Y, 170, 3.8);
          mine(4850);
        }
      },

      {
        title: "Unit 3 Double Chaser",
        bg: [200, 255, 200],
        start: vec2(100, 100),
        map: [
          "====================================================================================",
          "=                                                                                  =",
          "= c                                                                                =",
          "=        ====      ====      ====      ====      ====                              =",
          "=                                                                                  =",
          "=             ====      ====      ====      ====      ====                         =",
          "=                                                                                  =",
          "=                                                                              e   =",
          "====================================================================================",
        ],
        special(p) {
          chaser(p, 700);
          dart(1150, MID_TRAP_Y, 450);
          mine(1550);
          sweeper(2050, LOW_TRAP_Y, 200, 3.2);
          chaser(p, 2500);
          laser(3000);
          dart(3450, HIGH_TRAP_Y, 500);
          mine(3900);
          sweeper(4300, MID_TRAP_Y, 170, 3.6);
          chaser(p, 4700);
        }
      },

      {
        title: "Unit 4 Crushers",
        bg: [255, 180, 255],
        start: vec2(100, 100),
        map: [
          "====================================================================================",
          "=                                                                                  =",
          "= c                                                                                =",
          "=        ====      ====      ====      ====      ====      ====      ====          =",
          "=                                                                                  =",
          "=             ====      ====      ====      ====      ====      ====      ====     =",
          "=                                                                                  =",
          "=                                                                              e   =",
          "====================================================================================",
        ],
        special(p) {
          crusher(650);
          sweeper(1100, LOW_TRAP_Y, 180, 3.5);
          crusher(1600, 80, 300, 270);
          dart(2150, MID_TRAP_Y, 460);
          laser(2700);
          crusher(3200, 95, 295, 280);
          mine(3650);
          sweeper(4100, HIGH_TRAP_Y, 150, 4);
          dart(4550, LOW_TRAP_Y, 500);
          crusher(4900, 85, 300, 290);
        }
      },

      {
        title: "Unit 5 Acid Rise",
        bg: [200, 150, 255],
        start: vec2(100, 100),
        map: [
          "====================================================================================",
          "=                                                                                  =",
          "= c                                                                                =",
          "=        ====      ====      ====      ====      ====      ====                    =",
          "=                                                                                  =",
          "=             ====      ====      ====      ====      ====      ====               =",
          "=                                                                                  =",
          "=                                                                              e   =",
          "====================================================================================",
        ],
        special(p) {
          acid();
          fallingZone(900, 1.15, 400, 380);
          chaser(p, 1300);
          mine(1750);
          dart(2200, MID_TRAP_Y, 460);
          laser(2700, 110, 325, 260);
          sweeper(3200, LOW_TRAP_Y, 190, 3.4);
          fallingZone(3650, 1, 420, 400);
          mine(4100);
          chaser(p, 4500);
          dart(4850, HIGH_TRAP_Y, 520);
        }
      },

      {
        title: "Unit 6 Combo Hell",
        bg: [255, 220, 180],
        start: vec2(100, 100),
        map: [
          "====================================================================================",
          "=                                                                                  =",
          "= c                                                                                =",
          "=        ====      ====      ====      ====      ====      ====      ====          =",
          "=                                                                                  =",
          "=             ====      ====      ====      ====      ====      ====      ====     =",
          "=                                                                                  =",
          "=                                                                              e   =",
          "====================================================================================",
        ],
        special(p) {
          acid();
          fallingZone(700, 0.85, 420, 390);
          chaser(p, 1000);
          crusher(1450);
          sweeper(1900, LOW_TRAP_Y, 190, 3.6);
          dart(2350, MID_TRAP_Y, 480);
          fallingZone(2850, 0.8, 420, 410);
          laser(3300, 100, 330, 270);
          mine(3750);
          chaser(p, 4200);
          crusher(4550, 90, 300, 285);
          dart(4900, HIGH_TRAP_Y, 540);
        }
      },

      {
        title: "Unit 7 Laser Grid",
        bg: [180, 255, 255],
        start: vec2(100, 100),
        map: [
          "====================================================================================",
          "=                                                                                  =",
          "= c                                                                                =",
          "=        ====      ====      ====      ====      ====      ====      ====          =",
          "=                                                                                  =",
          "=             ====      ====      ====      ====      ====      ====      ====     =",
          "=                                                                                  =",
          "=                                                                              e   =",
          "====================================================================================",
        ],
        special(p) {
          laser(650, 95, 330, 260);
          dart(1050, HIGH_TRAP_Y, 500);
          laser(1450, 120, 330, 270);
          sweeper(1900, MID_TRAP_Y, 170, 3.6);
          laser(2350, 90, 330, 280);
          mine(2800);
          dart(3200, LOW_TRAP_Y, 500);
          laser(3650, 110, 330, 290);
          sweeper(4100, HIGH_TRAP_Y, 160, 4);
          laser(4550, 100, 330, 300);
          dart(4900, MID_TRAP_Y, 540);
        }
      },

      {
        title: "Unit 8 Chaos Mix",
        bg: [255, 255, 180],
        start: vec2(100, 100),
        map: [
          "====================================================================================",
          "=                                                                                  =",
          "= c                                                                                =",
          "=        ====      ====      ====      ====      ====      ====                    =",
          "=                                                                                  =",
          "=             ====      ====      ====      ====      ====      ====               =",
          "=                                                                                  =",
          "=                                                                              e   =",
          "====================================================================================",
        ],
        special(p) {
          acid();
          fallingZone(650, 0.9, 420, 390);
          chaser(p, 950);
          laser(1350);
          sweeper(1800, LOW_TRAP_Y, 200, 3.5);
          dart(2250, MID_TRAP_Y, 500);
          mine(2700);
          chaser(p, 3150);
          fallingZone(3550, 0.85, 420, 410);
          laser(3950, 100, 330, 280);
          sweeper(4350, HIGH_TRAP_Y, 170, 4);
          dart(4800, LOW_TRAP_Y, 540);
        }
      },

      {
        title: "FINAL Insanity",
        bg: [255, 150, 255],
        start: vec2(100, 100),
        map: [
          "====================================================================================",
          "=                                                                                  =",
          "= c                                                                                =",
          "=        ====      ====      ====      ====      ====      ====      ====          =",
          "=                                                                                  =",
          "=             ====      ====      ====      ====      ====      ====      ====     =",
          "=                                                                                  =",
          "=                                                                              e   =",
          "====================================================================================",
        ],
        special(p) {
          acid();
          fallingZone(600, 0.6, 440, 420);
          chaser(p, 850);
          crusher(1200, 80, 300, 300);
          dart(1600, HIGH_TRAP_Y, 560);
          sweeper(2000, LOW_TRAP_Y, 220, 4);
          laser(2450, 95, 330, 310);
          mine(2850);
          fallingZone(3150, 0.55, 440, 430);
          chaser(p, 3500);
          crusher(3900, 80, 300, 310);
          dart(4300, MID_TRAP_Y, 580);
          sweeper(4650, LOW_TRAP_Y, 220, 4.4);
          laser(4950, 90, 330, 320);
        }
      }
    ];

    // I fetch a chemistry question after each level.
    async function getQuestion(unit) {
      const baseUrl = "https://periodic-panic.onrender.com";
      const res = await fetch(`${baseUrl}/question/${unit}`);

      if (!res.ok) {
        throw new Error(`Server error: ${res.status}`);
      }

      const data = await res.json();

      if (!data) {
        throw new Error("No question found for unit " + unit);
      }

      return data;
    }

    // I choose a text size that keeps longer questions from running off the screen.
    function questionTextSize(question) {
      if (question.length > 260) return 17;
      if (question.length > 180) return 20;
      if (question.length > 110) return 23;
      return 28;
    }

    // I show the question scene between levels.
    scene("question", async ({ levelIndex }) => {
      bg([30, 30, 30]);

      // I make sure the question screen stays on the screen even if the camera was far across the map.
      camPos(width() / 2, height() / 2);

      // I use levelIndex + 1 so level 1 gets unit 1, level 2 gets unit 2, and the final level gets unit 9.
      const data = await getQuestion(levelIndex + 1);

      add([
        rect(1120, 640),
        pos(width() / 2, height() / 2),
        anchor("center"),
        color(15, 15, 30),
        fixed()
      ]);

      add([
        text(`Unit ${levelIndex + 1} Question`, {
          size: 22,
          width: 1040,
          align: "center"
        }),
        pos(width() / 2, 50),
        anchor("center"),
        color(180, 220, 255),
        fixed()
      ]);

      add([
        text(data.question, {
          size: questionTextSize(data.question),
          width: 1040,
          align: "left"
        }),
        pos(120, 90),
        color(255, 255, 255),
        fixed()
      ]);

      data.choices.forEach((choice, i) => {
        const y = 330 + i * 82;

        add([
          rect(1040, 66),
          pos(120, y),
          area(),
          color(50, 50, 85),
          fixed(),
          "choice",
          { value: choice }
        ]);

        add([
          text(choice, {
            size: choice.length > 55 ? 17 : 20,
            width: 980,
            align: "left"
          }),
          pos(145, y + 18),
          color(255, 255, 255),
          fixed()
        ]);
      });

      onClick("choice", (c) => {
        if (c.value === data.answer) {
          if (levelIndex + 1 < levels.length) {
            go("game", { i: levelIndex + 1 });
          } else {
            go("win");
          }
        } else {
          go("game", { i: levelIndex });
        }
      });
    });

    // I run the actual platforming level here.
    scene("game", ({ i }) => {
      let L = levels[i];

      bg(L.bg);
      setGravity(1600);

      let checkpoint = L.start.clone();

      addLevel(padMap(L.map), {
        tileWidth: TILE,
        tileHeight: TILE,
        tiles: tiles,
      });

      const player = add([
        rect(36, 36),
        pos(checkpoint),
        area(),
        body(),
        color(255, 255, 255),
        "player",
        health(3),
      ]);

      // I keep track of how many times I die.
      const deathText = add([
        text("Deaths: " + deaths),
        pos(20, 20),
        fixed()
      ]);

      onUpdate(() => {
        deathText.text = "Deaths: " + deaths;
      });

      // I use arrow keys or WASD to move.
      onKeyDown("left", () => player.move(-SPEED, 0));
      onKeyDown("a", () => player.move(-SPEED, 0));
      onKeyDown("right", () => player.move(SPEED, 0));
      onKeyDown("d", () => player.move(SPEED, 0));

      onKeyPress("space", () => {
        if (player.isGrounded()) player.jump(JUMP_FORCE);
      });

      onKeyPress("w", () => {
        if (player.isGrounded()) player.jump(JUMP_FORCE);
      });

      // I make some floor blocks randomly fall to keep the troll part.
      // player.onCollide("troll", (tile) => {
      //   if (rand() < 0.25) {
      //     wait(0.2, () => {
      //       tile.use(body({ isStatic: false }));

      //       if (rand() < 0.5) {
      //         destroy(tile);
      //       }
      //     });
      //   }
      // });

      // I keep the camera on the player and reset if I fall off.
      player.onUpdate(() => {
        camPos(player.pos);
        hurtTimer = Math.max(0, hurtTimer - dt());

        if (player.pos.y > height() + 200) {
          deaths++;
          go("game", { i });
        }
      });

      // I handle all danger, checkpoint, and level-end collisions here.
      player.onCollide("danger", () => {
        if (hurtPlayer(player, checkpoint)) {
          go("game", { i });
        }
      });

      player.onCollide("checkpoint", (c) => {
        checkpoint = c.pos.clone();
        destroy(c);
      });

      player.onCollide("end", () => {
        go("question", { levelIndex: i });
      });

      L.special(player);
    });

    // I show this after the final question is answered correctly.
    scene("win", () => {
      bg([20, 20, 40]);

      add([
        text("YOU BEAT AP CHEM PANIC!", {
          size: 48,
        }),
        pos(width() / 2, height() / 2 - 80),
        anchor("center"),
      ]);

      add([
        text(`Total Deaths: ${deaths}`, {
          size: 32,
        }),
        pos(width() / 2, height() / 2),
        anchor("center"),
      ]);

      add([
        text("Press SPACE to restart", {
          size: 24,
        }),
        pos(width() / 2, height() / 2 + 100),
        anchor("center"),
      ]);

      onKeyPress("space", () => {
        deaths = 0;
        go("game", { i: 0 });
      });
    });

    // I start the game on level 1.
    go("game", { i: 0 });
  </script>
</body>
</html>
